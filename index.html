    <script>
      // Only show loading screen on native mobile platforms
      // This will be properly detected once Capacitor loads, but we hide by default for web
      (function() {
        // By default, hide the loading screen (for web)
        // It will be shown by the React app if running on native mobile
        var loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          // Check if we're likely on native by looking for Capacitor indicators
          // If Capacitor isn't loaded yet, we'll hide it and let the React app handle it
          var isLikelyNative = false;
          try {
            // Check for common native app indicators
            if (window.Capacitor) {
              isLikelyNative = true;
            } else if (window.Android || window.webkit?.messageHandlers) {
              // Android WebView or iOS WKWebView
              isLikelyNative = true;
            }
          } catch(e) {
            // Ignore errors
          }
          
          // Only show if we're confident it's native, otherwise hide
          if (!isLikelyNative) {
            loadingScreen.style.display = 'none';
          }
        }
      })();
